name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Jobs:
#   1. swift        — macOS: build + test both packages, lint
#   2. server-linux — Linux: build + test the server package (the Lambda target)
#   3. cdk          — Linux: tsc + jest + lint for the CDK constructs
#
# The SampleApp template has no .xcodeproj by design (project files don't
# survive templating). The template Swift files compile transitively through
# the client package's own build — the types they reference (RemoteConfigStore,
# KeelFlag, TelemetryService, etc.) must exist and be public for the client
# package itself to build. A dedicated SampleApp build would need a generated
# Xcode project; park that until the template gains one.
#
# TODO: Once `scripts/keel-new.sh` generates a buildable project, add:
#       keel new CITestApp && xcodebuild build -project CITestApp/...
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ── Swift (client + server) ──────────────────────────────────────────────
  swift:
    name: Swift — build, test, lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Lint Swift
        run: make lint-swift

  # ── Swift server on Linux (the Lambda target) ────────────────────────────
  # The Lambda ships as PROVIDED_AL2023 arm64, so the server half must build and test
  # on Linux (swift-crypto / swift-corelibs-foundation), not only on the macOS runner
  # above. Package.swift omits the Apple-only client targets when SwiftPM runs on
  # Linux, so a plain `swift build` here is the server half; the client is Apple/Skip
  # code and stays macOS-only. keel-cli gets its Linux compile coverage from this leg.
  server-linux:
    name: Swift server — Linux build + test
    runs-on: ubuntu-latest
    container: swift:6.2-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-linux-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-linux-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  # ── CDK constructs (TypeScript) ──────────────────────────────────────────
  cdk:
    name: CDK — typecheck, test, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
